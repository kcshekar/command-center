# Pod Disruption Budgets — ensure availability during voluntary disruptions
# (node drains, rolling updates, cluster maintenance)
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: api-pdb
  namespace: command-center
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: web-pdb
  namespace: command-center
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app: web
